theme = "base16_default"
[editor]
"auto-format" = false

[keys.insert]
"C-p" = "completion"
"C-/" = "toggle_comments"

[keys.normal]
"]" = "jump_view_right"
"[" = "jump_view_left"

"C-]" = ":buffer-next"
"C-[" = ":buffer-previous"

"j" = "move_char_left"
"l" = "move_char_right"
"i" = "move_visual_line_up"
"k" = "move_visual_line_down"

"C-i" = "scroll_up"
"C-up" = "scroll_up"
"C-k" = "scroll_down"
"C-down" = "scroll_down"

"S-j" = "move_prev_word_start"
"S-l" = "move_next_word_start"
"S-i" = "page_cursor_half_up"
"S-up" = "page_cursor_half_up"
"S-k" = "page_cursor_half_down"
"S-down" = "page_cursor_half_down"

"u" = "yank"
"S-u" = "yank_main_selection_to_clipboard"
"o" = "paste_after"
"O" = "paste_before"

"C-s" = ":write"

"m" = "save_selection"
"<" = "jump_backward"
">" = "jump_forward"

"s" = "select_mode"
"w" = "insert_mode"
"C-/" = "toggle_comments"
"r" = "replace_with_yanked"
"f" = "search"

"S-z" = "redo"
"z" = "undo"

"p" = "open_below"
"P" = "open_above"

"c" = "copy_selection_on_next_line"
"C" = "keep_primary_selection"

"S-d" = "delete_selection"
"d" = "delete_selection_noyank"


[keys.select]
"j" = "extend_char_left"
"l" = "extend_char_right"
"i" = "extend_line_up"
"k" = "extend_line_down"

"C-j" = "extend_char_left"
"C-l" = "extend_char_right"
"C-i" = "extend_line_up"
"C-k" = "extend_line_down"

"S-j" = "move_prev_long_word_start"
"S-l" = "move_next_long_word_start"
"S-i" = "page_cursor_half_up"
"S-k" = "page_cursor_half_down"

"r" = "replace_with_yanked"

"u" = "yank"
"S-u" = "yank_main_selection_to_clipboard"

"o" = "paste_after"
"O" = "paste_before"

"w" = "extend_prev_word_start"
"W" = "extend_prev_long_word_start"

"S-d" = "delete_selection"
"d" = "delete_selection_noyank"

"C-/" = "toggle_comments"


[keys.select.space]
"S-u" = "yank_main_selection_to_clipboard"
"u" = "yank_to_clipboard"
"S-o" = "paste_clipboard_before"
"o" = "paste_clipboard_after"
"r" = "replace_selections_with_clipboard"

[keys.normal.space]
"S-u" = "yank_main_selection_to_clipboard"
"u" = "yank_to_clipboard"
"S-o" = "paste_clipboard_before"
"o" = "paste_clipboard_after"
"r" = "replace_selections_with_clipboard"
